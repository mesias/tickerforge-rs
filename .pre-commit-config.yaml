repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo
        args: [fmt, --all]
        language: system
        pass_filenames: false

      - id: cargo-clippy-fix
        name: cargo clippy --fix
        entry: cargo
        args:
          [clippy, --fix, --allow-staged, --allow-dirty, --all-targets]
        language: system
        pass_filenames: false

      - id: cargo-fmt-post-clippy
        name: cargo fmt (after clippy --fix)
        entry: cargo
        args: [fmt, --all]
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo
        args: [clippy, --all-targets, --, -D, warnings]
        language: system
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo
        args: [test]
        language: system
        pass_filenames: false
