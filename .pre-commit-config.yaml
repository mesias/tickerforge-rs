repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cargo fmt --all'
        language: system
        pass_filenames: false

      - id: cargo-clippy-fix
        name: cargo clippy --fix
        entry: bash -c 'cargo clippy --fix --allow-staged --allow-dirty --all-targets'
        language: system
        pass_filenames: false

      - id: cargo-fmt-post-clippy
        name: cargo fmt (after clippy --fix)
        entry: bash -c 'cargo fmt --all'
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cargo clippy --all-targets -- -D warnings'
        language: system
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: bash -c 'cargo test'
        language: system
        pass_filenames: false
