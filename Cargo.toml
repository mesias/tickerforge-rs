[package]
name = "tickerforge"
version = "0.1.9"
edition = "2021"
rust-version = "1.74"
description = "Generate and parse derivatives tickers from tickerforge-spec (Rust)."
license = "MIT"
repository = "https://github.com/mesias/tickerforge-rs"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.10"
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
bdays = "0.1"
# Default spec tree (must match a published `tickerforge-spec-data` on crates.io for `cargo publish`).
# Local override: clone tickerforge-spec alongside and use `[patch.crates-io]` (see CI workflow).
tickerforge-spec-data = "^0.1.8"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
] }
csv = "1.3"
xz2 = "0.1.7"

[patch.crates-io]
tickerforge-spec-data = { path = "../tickerforge-spec" }
